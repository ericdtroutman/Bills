/* ======================================================================= modal + toast */
function modal(html) {
  var el = document.getElementById('modal'); el.innerHTML = '<div class="mbox">' + html + '</div>'; el.classList.add('on');
  return el;
}
function closeModal() { var el = document.getElementById('modal'); el.classList.remove('on'); el.innerHTML = ''; }
function confirmBox(title, text, ok, cb) {
  var el = modal('<h3>' + esc(title) + '</h3><p>' + esc(text) + '</p><div class="mact"><button class="btn" data-m="no">Cancel</button>' +
    '<button class="btn danger solid" data-m="yes">' + esc(ok) + '</button></div>');
  el.onclick = function (e) {
    var b = e.target.closest('[data-m]'); if (!b && e.target !== el) return;
    closeModal(); if (b && b.dataset.m === 'yes') cb();
  };
}
function askName(title, ph, withColor, cb) {
  var chosen = 'blue';
  var el = modal('<h3>' + esc(title) + '</h3><form id="mform"><input name="n" placeholder="' + esc(ph) + '" autocomplete="off">' +
    (withColor ? '<div class="swatches">' + Object.keys(PALETTE).map(function (k) {
      return '<button type="button" data-c="' + k + '" style="--c:' + PALETTE[k] + '" class="' + (k === chosen ? 'on' : '') + '"></button>'; }).join('') + '</div>' : '') +
    '<div class="mact"><button type="button" class="btn" data-m="no">Cancel</button><button class="btn primary">Add</button></div></form>');
  var input = el.querySelector('input'); input.focus();
  el.onclick = function (e) {
    var sw = e.target.closest('[data-c]');
    if (sw) { chosen = sw.dataset.c; Array.prototype.forEach.call(el.querySelectorAll('[data-c]'), function (b) { b.classList.toggle('on', b === sw); }); return; }
    if (e.target.closest('[data-m="no"]') || e.target === el) closeModal();
  };
  el.querySelector('#mform').onsubmit = function (e) {
    e.preventDefault(); var v = input.value.trim(); if (!v) return; closeModal(); cb(v, chosen);
  };
}
var toastTimer;
function toast(html, ms) {
  var t = document.getElementById('toast'); t.innerHTML = html; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('on'); }, ms || 3500);
}

/* ======================================================================= events */
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b || !S) return;
  var a = b.dataset.act, id = b.dataset.id;
  if (a === 'goto') {
    query = ''; document.getElementById('q').value = '';
    view = 'cards'; selCard = b.dataset.card; store('card', selCard); render();
    var r = document.querySelector('[data-charge="' + id + '"]');
    if (r) { r.scrollIntoView({ block: 'center', behavior: 'smooth' }); r.classList.add('flash'); }
    return;
  }
  if (a === 'nav') { query = ''; document.getElementById('q').value = ''; view = b.dataset.v; store('view', view); render(); window.scrollTo(0, 0); }
  else if (a === 'addnote') {
    openNote[id] = true; render();
    var ni = document.querySelector('input[data-t="Bills"][data-id="' + id + '"][data-f="note"]'); if (ni) ni.focus();
  }
  else if (a === 'login') { openLogin[id] = !openLogin[id]; render(); }
  else if (a === 'showpw') { showPw[id] = !showPw[id]; render(); }
  else if (a === 'copy') { var cr = find(b.dataset.t, id); if (cr && cr[b.dataset.f]) copyText(cr[b.dataset.f]); else toast('Nothing to copy yet'); }
  else if (a === 'side') { billSide = b.dataset.p; store('side', billSide); render(); }
  else if (a === 'card') { selCard = id; store('card', id); render(); }
  else if (a === 'pickwho') { lastWho = b.dataset.w; Array.prototype.forEach.call(b.parentNode.children, function (x) { x.classList.toggle('on', x === b); }); }
  else if (a === 'undo') { undo(); }
  else if (a === 'ckkind') {
    var ckr = find('Checking', id);
    undoLabel = 'answering “' + ckr.name + '”';
    upsert('Checking', { id: id, kind: b.dataset.k }); render();
  }
  else if (a === 'ckpair') {
    var pw = b.dataset.with;
    undoLabel = 'matching a passing-through pair';
    upsert('Checking', { id: id, kind: 'pass', pairId: pw }); upsert('Checking', { id: pw, pairId: id }); render();
  }
  else if (a === 'mmdeps') { mmShowDeposits = !mmShowDeposits; render(); }
  else if (a === 'closeperiod') {
    var mmc = moneyMath(calc());
    confirmBox('Close out this pay period?', 'Your list starts fresh, the card charges listed here are marked as paid back, and a summary is saved to History.' +
      (mmc.unDep.length || mmc.unOut.length ? ' You still have unanswered checking items.' : ''), 'Close out', closePeriod);
  }
  else if (a === 'clearcash') {
    var cl = (S.JointCash || []).slice();
    confirmBox('Clear out-of-pocket?', 'This takes the ' + cl.length + ' out-of-pocket item' + (cl.length === 1 ? '' : 's') + ' off the joint. Search can still find them.', 'Clear', function () {
      undoLabel = 'clearing out-of-pocket';
      var d = today();
      cl.forEach(function (j) { upsert('History', { id: j.id, cardId: 'cash', item: j.item, amount: j.amount, who: 'Joint', date: j.date || '', clearedOn: d }); });
      removeIds('JointCash', cl.map(function (j) { return j.id; })); render();
      toast('Out-of-pocket cleared <button class="toast-btn" data-act="undo">Undo</button>', 8000);
    });
  }
  else if (a === 'hold') {
    var hc = find('Charges', id);
    undoLabel = (hc.hold ? 'taking “' : 'putting “') + hc.item + (hc.hold ? '” off hold' : '” on hold');
    upsert('Charges', { id: id, hold: !hc.hold }); render();
  }
  else if (a === 'del') {
    var dr = find(b.dataset.t, id) || {};
    undoLabel = 'deleting “' + (dr.item || dr.name || dr.note || 'item') + '”';
    removeRow(b.dataset.t, id); render();
    toast('Deleted “' + esc(dr.item || dr.name || dr.note || 'item') + '” <button class="toast-btn" data-act="undo">Undo</button>', 6000);
  }
  else if (a === 'paid') { var c = find('Cards', id); undoLabel = 'marking ' + c.name + (c.paid ? ' unpaid' : ' paid'); upsert('Cards', { id: id, paid: !c.paid }); render(); }
  else if (a === 'clearcard') {
    var cc = find('Cards', id), n = S.Charges.filter(function (x) { return x.cardId === id && !x.hold; }).length;
    var nh = S.Charges.filter(function (x) { return x.cardId === id && x.hold; }).length;
    confirmBox('Clear ' + cc.name + '?', 'This takes its ' + n + ' charge' + (n === 1 ? '' : 's') + ' off the card (search can still find them) and sets it back to unpaid.' +
      (nh ? ' The ' + nh + ' on hold stay on the card.' : '') + ' Do this after you’ve paid the card.', 'Clear charges', function () {
      undoLabel = 'clearing ' + cc.name;
      var day = today();
      var toClear = S.Charges.filter(function (x) { return x.cardId === id && !x.hold; });
      var keepRows = toClear.map(function (x) {
        return { id: x.id, cardId: id, item: x.item, amount: x.amount, who: x.who, date: x.date || '', clearedOn: day };
      });
      // save a copy of each charge to History first, so search can still find it after the card is cleared
      keepRows.forEach(function (r) { upsert('History', r); });
      removeIds('Charges', toClear.map(function (x) { return x.id; })); upsert('Cards', { id: id, paid: false }); render();
      toast(esc(cc.name) + ' cleared <button class="toast-btn" data-act="undo">Undo</button>', 8000);
    });
  }
  else if (a === 'delcard') {
    var dc = find('Cards', id);
    confirmBox('Delete ' + dc.name + '?', 'The card and all its charges will be removed.', 'Delete card', function () {
      undoLabel = 'deleting ' + dc.name;
      removeWhere('Charges', 'cardId', id); removeRow('Cards', id); selCard = null; render();
      toast('Deleted ' + esc(dc.name) + ' <button class="toast-btn" data-act="undo">Undo</button>', 8000);
    });
  }
  else if (a === 'addcard') {
    askName('Add a card', 'Card name', true, function (name, color) {
      var c = { id: uid('card'), name: name, color: color, paid: false, order: nextOrder(S.Cards) };
      upsert('Cards', c); selCard = c.id; store('card', c.id); focusAfter = '#add-item'; render();
    });
  }
  else if (a === 'billpaid') {
    undoLabel = 'color change';
    var bl = find('Bills', id), nextSt = bl.status === 'half' ? 'paid' : bl.status === 'paid' ? '' : 'half';
    upsert('Bills', { id: id, status: nextSt, paid: nextSt === 'paid' }); render();
  }
  else if (a === 'move') { undoLabel = 'moving a bill'; var mv = find('Bills', id); upsert('Bills', { id: id, payOn: mv.payOn === '1st' ? '15th' : '1st', order: nextOrder(S.Bills) }); render(); }
  else if (a === 'uncheck') {
    undoLabel = 'clearing colors';
    S.Bills.filter(function (x) { return x.payOn === b.dataset.p && x.status; }).forEach(function (x) { upsert('Bills', { id: x.id, status: '', paid: false }); });
    render();
  }
  else if (a === 'addfund') {
    askName('Add a fund', 'Fund name', true, function (name, color) { upsert('Funds', { id: uid('f'), name: name, color: color, order: nextOrder(S.Funds) }); render(); });
  }
  else if (a === 'delfund') {
    var f = find('Funds', id);
    confirmBox('Delete ' + f.name + '?', 'The fund and its history will be removed.', 'Delete fund', function () {
      undoLabel = 'deleting ' + f.name;
      removeWhere('FundEntries', 'fundId', id); removeRow('Funds', id); render();
      toast('Deleted ' + esc(f.name) + ' <button class="toast-btn" data-act="undo">Undo</button>', 8000);
    });
  }
  else if (a === 'addperson') {
    askName('Add a person', 'Name', false, function (name) { upsert('People', { id: uid('p'), name: name, budget: 0, order: nextOrder(S.People) }); render(); });
  }
  else if (a === 'delperson') {
    var p = find('People', id);
    confirmBox('Remove ' + p.name + '?', 'Their gifts will be removed too.', 'Remove', function () {
      undoLabel = 'removing ' + p.name;
      removeWhere('Gifts', 'personId', id); removeRow('People', id); render();
      toast('Removed ' + esc(p.name) + ' <button class="toast-btn" data-act="undo">Undo</button>', 8000);
    });
  }
  else if (a === 'backup') {
    toast('Making a backup copy…', 8000);
    api('backup').then(function (r) {
      toast('Backup saved to your Google Drive: <a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.name) + '</a>', 7000);
    }, function () { toast('Backup failed. Try again in a minute.'); });
  }
  else if (a === 'banksync') {
    b.disabled = true; b.textContent = 'Syncing…';
    api('bankSync').then(function (r) {
      refreshData(r.added ? 'Added ' + r.added + ' new charge' + (r.added === 1 ? '' : 's') : 'No new charges');
    }, function (e) { refreshData(); toast(esc(cleanMsg(e.message)), 6000); });
  }
  else if (a === 'bankdisconnect') {
    confirmBox('Disconnect SimpleFIN?', 'New charges will stop coming in. Charges already brought in stay where they are.', 'Disconnect', function () {
      api('bankDisconnect').then(function () { refreshData('Disconnected'); }, function (e) { toast(esc(cleanMsg(e.message))); });
    });
  }
  else if (a === 'logout') {
    confirmBox('Log out on this device?', 'This forgets the app link and passcode on this device only. Your bills stay safe in your Google Sheet.', 'Log out', function () {
      forget('url'); forget('key'); CONN = { url: null, key: null }; S = null; showConnect();
    });
  }
});

function find(table, id) { return S[table].filter(function (r) { return r.id === id; })[0]; }

document.addEventListener('change', function (e) {
  var el = e.target; if (!el.dataset || !el.dataset.t || !el.dataset.id) return;
  var t = el.dataset.t, f = el.dataset.f, id = el.dataset.id, v = el.value;
  if (f === 'amount' || f === 'total' || f === 'us' || f === 'budget' || (t === 'Settings' && id === 'christmasBudget')) {
    var n = parseAmt(v);
    if (n === null) { render(); return; }
    v = t === 'Settings' ? String(n) : n;
  } else if (f === 'password') {
    // keep passwords exactly as typed
  } else if (f !== 'who' && f !== 'date') {
    v = v.trim();
    if (!v && (f === 'name')) { render(); return; }
  }
  undoLabel = 'editing';
  var row = { id: id }; row[f] = v;
  if (t === 'Settings' && !find('Settings', id)) S.Settings.push({ id: id, value: '' });
  upsert(t, row);
  render();
});

document.addEventListener('submit', function (e) {
  var form = e.target; if (!form.dataset.form) return;
  e.preventDefault();
  if (form.dataset.form === 'bankconnect') {
    var tok = form.querySelector('[name="token"]').value.trim();
    if (!tok) return nudge(form);
    var btn = form.querySelector('button'); btn.disabled = true; btn.textContent = 'Connecting…';
    api('bankConnect', { token: tok }).then(function () { refreshData('Connected. Now pick which card each account is.'); },
      function (e) { btn.disabled = false; btn.textContent = 'Connect'; toast(esc(cleanMsg(e.message)), 7000); });
    return;
  }
  if (form.dataset.form === 'connect') {
    var link = normalizeLink(form.querySelector('[name="link"]').value), key = form.querySelector('[name="key"]').value;
    if (!link) { showConnect('That doesn’t look like your app link. It should end in /exec, or paste the Deployment ID that starts with AKfy.'); return; }
    if (!key) { CONN.url = link; showConnect('Type your passcode.'); return; }
    CONN = { url: link, key: key };
    load();
    return;
  }
  undoLabel = 'adding';
  var k = form.dataset.form, val = function (n) { var el = form.querySelector('[name="' + n + '"]'); return el ? el.value.trim() : ''; };
  if (k === 'charge') {
    var amt = parseAmt(val('amount')); if (!val('item') || amt === null) return nudge(form);
    upsert('Charges', { id: uid('ch'), cardId: form.dataset.card, item: val('item'), amount: amt, who: lastWho, order: nextOrder(S.Charges), date: today(), hold: false });
    focusAfter = '#add-item';
  } else if (k === 'joint') {
    var ja = parseAmt(val('amount')); if (!val('item') || ja === null) return nudge(form);
    upsert('Joint', { id: uid('j'), item: val('item'), amount: ja, order: nextOrder(S.Joint) });
    focusAfter = '#add-joint';
  } else if (k === 'jointcash') {
    var ca = parseAmt(val('amount')); if (!val('item') || ca === null) return nudge(form);
    upsert('JointCash', { id: uid('jc'), item: val('item'), amount: ca, date: today(), order: nextOrder(S.JointCash || []) });
    focusAfter = '#add-cash';
  } else if (k === 'bill') {
    var tot = parseAmt(val('total')), us = parseAmt(val('us'));
    if (!val('name') || tot === null) return nudge(form);
    upsert('Bills', { id: uid('b'), payOn: form.dataset.p, name: val('name'), total: tot, us: us === null ? tot : us, paid: false, status: '', note: val('note'), order: nextOrder(S.Bills) });
    focusAfter = '#add-bill-' + form.dataset.p;
  } else if (k === 'entry') {
    var ea = parseAmt(val('amount')); if (ea === null) return nudge(form);
    var dir = (e.submitter && e.submitter.dataset.dir) || 'in';
    upsert('FundEntries', { id: uid('fe'), fundId: form.dataset.fund, date: val('date'), note: val('note'),
      amount: dir === 'out' ? -Math.abs(ea) : Math.abs(ea), order: nextOrder(S.FundEntries) });
  } else if (k === 'gift') {
    var ga = parseAmt(val('amount')); if (!val('item') || ga === null) return nudge(form);
    upsert('Gifts', { id: uid('g'), personId: form.dataset.person, item: val('item'), amount: ga, order: nextOrder(S.Gifts) });
  }
  render();
});
function nudge(form) {
  var f = Array.prototype.filter.call(form.querySelectorAll('input'), function (i) { return !i.value.trim() && i.name !== 'note' && i.name !== 'us'; })[0];
  if (f) { f.focus(); f.style.borderColor = 'var(--bad)'; setTimeout(function () { f.style.borderColor = ''; }, 1200); }
}
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeModal(); return; }
  // Ctrl+Z / Cmd+Z undoes the last change, except while typing in a box (there it undoes typing as usual)
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (S && tag !== 'input' && tag !== 'textarea' && tag !== 'select') { e.preventDefault(); undo(); return; }
  }
  var chip = e.target.closest && e.target.closest('.whopick button');
  if (chip && e.key === 'Enter') {
    e.preventDefault();
    if (chip.classList.contains('on')) {
      var form = chip.closest('form');
      if (form.requestSubmit) form.requestSubmit(); else form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
    } else {
      chip.click();      // picks this person and keeps focus here, so the next Enter adds it
      chip.focus();
    }
  }
});

/* ======================================================================= drag to reorder (bills, money entries) */
// A list that can be reordered has data-dtable (which tab), data-dfield + data-dgroup (e.g. payOn = 1st)
// and optional data-dreverse="1" when it is shown newest first. Each row has data-did.
var drag = null;
document.addEventListener('pointerdown', function (e) {
  var grip = e.target.closest && e.target.closest('[data-grip]');
  if (!grip || !S || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault();
  var row = grip.closest('[data-did]');
  drag = { row: row, table: row.parentNode.dataset.dtable, y: e.clientY };
  row.classList.add('dragging');
  document.body.classList.add('drag-on');
  autoScroll();
});
document.addEventListener('pointermove', function (e) {
  if (!drag) return;
  e.preventDefault();
  drag.y = e.clientY;
  var under = document.elementFromPoint(e.clientX, e.clientY);
  if (!under) return;
  var list = under.closest('.rows[data-dtable="' + drag.table + '"]');
  Array.prototype.forEach.call(document.querySelectorAll('.rows[data-dtable]'), function (l) { l.classList.toggle('drop-target', l === list && l !== drag.row.parentNode); });
  if (!list) return;
  var target = under.closest('[data-did]');
  if (target && target !== drag.row && target.parentNode === list) {
    var r = target.getBoundingClientRect();
    var after = e.clientY > r.top + r.height / 2;
    // keep an open login box attached under its bill
    var anchor = after ? (target.nextElementSibling && target.nextElementSibling.classList.contains('login') ? target.nextElementSibling : target) : target;
    list.insertBefore(drag.row, after ? anchor.nextSibling : anchor);
  } else if (!target && drag.row.parentNode !== list) {
    var empty = list.querySelector('.empty'); if (empty) empty.remove();
    list.appendChild(drag.row);
  }
}, { passive: false });
function endDrag() {
  if (!drag) return;
  var d = drag; drag = null;
  d.row.classList.remove('dragging');
  document.body.classList.remove('drag-on');
  undoLabel = 'reordering';
  var list = d.row.parentNode, ds = list.dataset;
  var ids = Array.prototype.map.call(list.querySelectorAll('[data-did]'), function (r) { return r.dataset.did; });
  var n = ids.length;
  ids.forEach(function (id, i) {
    var b = find(ds.dtable, id); if (!b) return;
    var want = ds.dreverse === '1' ? n - i : i + 1, change = {};
    if (b.order !== want) change.order = want;
    if (ds.dfield && b[ds.dfield] !== ds.dgroup) change[ds.dfield] = ds.dgroup;
    if (Object.keys(change).length) { change.id = id; upsert(ds.dtable, change); }
  });
  render();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
function autoScroll() {
  if (!drag) return;
  var edge = 70, h = window.innerHeight;
  if (drag.y < edge + 60) window.scrollBy(0, -Math.ceil((edge + 60 - drag.y) / 6));
  else if (drag.y > h - edge) window.scrollBy(0, Math.ceil((drag.y - (h - edge)) / 6));
  requestAnimationFrame(autoScroll);
}

/* ======================================================================= start */
function showConnect(msg) {
  document.body.classList.add('locked');
  document.getElementById('app').innerHTML =
    '<form class="connect" data-form="connect"><h1>Open your bills</h1>' +
    '<p class="sub" style="margin:0">Enter these once on this device and it will remember them.</p>' +
    '<label for="c-link">App link</label><input id="c-link" name="link" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(CONN.url || '') + '">' +
    '<label for="c-key">Passcode</label><input id="c-key" name="key" type="password" autocomplete="current-password" placeholder="Your passcode">' +
    (msg ? '<div class="err">' + esc(msg) + '</div>' : '') +
    '<button class="btn primary" type="submit">Open</button>' +
    '<div class="help">The app link is in Google Apps Script under Deploy &gt; Manage deployments (Web app URL). ' +
    'You can also paste just the Deployment ID that starts with AKfy. The passcode is the one you typed at the top of Code.gs.</div></form>';
  var f = document.getElementById(CONN.url ? 'c-key' : 'c-link'); if (f) f.focus();
}

function load() {
  document.body.classList.remove('locked');
  document.getElementById('app').innerHTML = '<div class="loading">Loading your bills…</div>';
  // anything that didn't save before (for example after a passcode change) is saved first
  var pending = queue; queue = [];
  (pending.length ? api('apply', { ops: pending }) : Promise.resolve()).then(function () {
    return api('getData');
  }).then(function (data) {
    store('url', CONN.url); store('key', CONN.key);   // remember only once they work
    S = data; status('All changes saved'); render();
  }, function (err) {
    queue = pending.concat(queue);
    if (authProblem(err)) { showConnect(cleanMsg(err.message)); return; }
    document.getElementById('app').innerHTML = '<div class="loading">Couldn’t reach your Google Sheet.<br><small>' + esc(err && err.message) +
      '</small><br><br><button class="btn" onclick="load()">Try again</button> <button class="btn" onclick="showConnect()">Change link or passcode</button></div>';
  });
}

if (CONN.url && CONN.key) load(); else showConnect();
</script>
