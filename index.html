<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bills</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bills">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F5F8; --surface: #FFFFFF; --ink: #161B26; --ink2: #3B4252; --muted: #7B8494;
    --line: #E7E9EE; --soft: #F7F8FA; --accent: #4C6EF5; --accent-soft: #EDF1FF;
    --good: #2B8A3E; --good-soft: #E6F6EA; --bad: #E03131; --bad-soft: #FDECEC;
    --radius: 16px; --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- top bar */
  .top { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1280px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -.2px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #4C6EF5, #845EF7);
    color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 15px; }
  nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  nav::-webkit-scrollbar { display: none; }
  nav button { border: 0; background: transparent; padding: 7px 9px; font-size: 13.5px; border-radius: 999px; color: var(--muted);
    font-weight: 600; white-space: nowrap; }
  nav button:hover { color: var(--ink); background: var(--soft); }
  nav button.on { background: var(--ink); color: #fff; }
  .top-right { display: flex; align-items: center; gap: 12px; }
  #status { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #status.err { color: var(--bad); font-weight: 600; }
  .btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px;
    font-weight: 600; font-size: 13px; }
  .btn:hover { border-color: #CDD2DB; }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.danger { color: var(--bad); }
  .btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn.small { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
  .link { border: 0; background: none; padding: 0; color: var(--muted); font-size: 12px; font-weight: 600; }
  .link:hover { color: var(--ink); }
  .link.danger:hover { color: var(--bad); }

  main { max-width: 1240px; margin: 0 auto; padding: 22px 20px 80px; }
  .loading { padding: 80px 0; text-align: center; color: var(--muted); }
  h1 { font-size: 26px; letter-spacing: -.5px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; }

  /* ---------- stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .tile { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; }
  .tile.click { cursor: pointer; }
  .tile.click:hover { outline: 2px solid var(--accent-soft); }
  .tile .lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
  .tile .val { font-size: 24px; font-weight: 800; letter-spacing: -.5px; margin-top: 2px; }
  .tile .val.neg { color: var(--bad); }
  .tile .val.pos { color: var(--good); }
  .tile .hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .tile .hint.warn { color: var(--bad); font-weight: 600; }
  .tile input.val { width: 100%; border: 0; padding: 0; background: transparent; outline: none; }

  /* ---------- card picker */
  .pills { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 12px; margin: 0 -2px 6px; scrollbar-width: thin; }
  .pill { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 150px;
    border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 14px; text-align: left;
    position: relative; overflow: hidden; }
  .pill::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
  .pill .pname { font-weight: 700; font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .pill .ptot { font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
  .pill.on { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); }
  .pill.add { justify-content: center; align-items: center; color: var(--muted); font-weight: 600; min-width: 110px;
    border-style: dashed; }
  .pill.add::before { display: none; }
  .badge { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--good-soft);
    color: var(--good); }

  /* ---------- panels */
  .panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .phead { padding: 18px 20px 14px; display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap;
    border-top: 5px solid var(--c, var(--ink)); }
  .phead .grow { flex: 1; min-width: 180px; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  .title-in { font-size: 22px; font-weight: 800; letter-spacing: -.4px; border: 0; background: transparent; padding: 2px 6px;
    margin-left: -6px; border-radius: 8px; width: 100%; outline: none; }
  .title-in:hover { background: var(--soft); }
  .title-in:focus { background: var(--soft); box-shadow: 0 0 0 2px var(--accent-soft); }
  .big { font-size: 30px; font-weight: 800; letter-spacing: -.8px; text-align: right; }
  .big small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  .pactions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .breakdown { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 20px 14px; }
  .bk { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--ink2); font-weight: 600; }
  .bk b { font-weight: 700; }
  .pfoot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between;
    align-items: center; gap: 10px; flex-wrap: wrap; }

  /* ---------- add forms */
  .addrow { display: flex; gap: 8px; padding: 12px 20px; background: var(--soft); border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
  .addrow input { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 12px; outline: none; min-width: 0; }
  .addrow input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .addrow .f-item { flex: 2 1 160px; }
  .addrow .f-amt { flex: 0 1 110px; text-align: right; }
  .addrow .f-date { flex: 0 1 150px; }
  .whopick { display: flex; gap: 4px; flex-wrap: wrap; }
  .whopick button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 11px; font-size: 12px;
    font-weight: 600; color: var(--ink2); }
  .whopick button.on { color: #fff; border-color: transparent; background: var(--w); }

  /* ---------- rows */
  .rows { }
  .hrow, .row { display: grid; align-items: center; gap: 8px; padding: 0 20px; }
  .hrow { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700;
    padding-top: 10px; padding-bottom: 6px; }
  .row { border-top: 1px solid var(--line); min-height: 44px; }
  .row:first-child { border-top: 0; }
  .row:hover { background: #FBFBFD; }
  .g-charge { grid-template-columns: 26px 1fr 110px 108px 26px; }
  .holdbox { width: 18px; height: 18px; border-radius: 5px; border: 2px solid #C3C8D2; background: #fff; padding: 0; display: grid; place-items: center; }
  .holdbox:hover { border-color: #868E96; }
  .holdbox.on { background: #868E96; border-color: #868E96; }
  .holdbox.on::after { content: ""; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .row.held, .row.held:hover { background: #F1F3F5; }
  .row.held .cell, .row.held .amt span { color: #ADB5BD; text-decoration: line-through; }
  .row.held select.who { filter: grayscale(1); opacity: .6; }
  .hchip { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: #E9ECF1; color: #6B7280; margin-left: 4px; text-decoration: none; }
  .bk.hold { background: #E9ECF1; color: #495057; }
  .g-bill { grid-template-columns: 16px 28px 1fr 96px 96px 28px 64px 22px; }
  .row.g-bill, .hrow.g-bill { padding-left: 8px; }
  .grip { width: 16px; height: 28px; display: grid; place-items: center; color: #C3C8D2; cursor: grab;
    touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 6px; }
  .grip:hover { color: var(--ink2); background: var(--soft); }
  .grip svg { width: 10px; height: 16px; }
  .row.dragging { position: relative; z-index: 3; background: #fff !important; box-shadow: 0 8px 24px rgba(16,24,40,.18);
    border-radius: 10px; pointer-events: none; opacity: .97; }
  body.drag-on, body.drag-on * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
  .rows.drop-target { outline: 2px dashed var(--accent-soft); outline-offset: -2px; }
  .key { border: 1px solid transparent; background: none; border-radius: 8px; width: 28px; height: 28px; padding: 0;
    display: grid; place-items: center; color: #B8BEC9; }
  .key:hover { background: var(--soft); color: var(--ink2); }
  .key.has { color: var(--accent); }
  .key.open { background: var(--accent-soft); color: var(--accent); }
  .key svg { width: 15px; height: 15px; }
  .login { margin: 0 20px 14px; padding: 14px 16px; border-radius: 12px; background: #F8F9FC; border: 1px solid var(--line);
    display: grid; grid-template-columns: 82px 1fr; gap: 8px 12px; align-items: center; }
  .row + .login { margin-top: 2px; }
  .login label { font-size: 12px; font-weight: 700; color: var(--muted); }
  .lf { display: flex; gap: 6px; align-items: center; min-width: 0; }
  .lf .cell { flex: 1; margin: 0; background: #fff; border: 1px solid var(--line); padding: 7px 10px; }
  .lf .cell:focus { border-color: var(--accent); }
  .lf .btn { flex: 0 0 auto; }
  .g-two { grid-template-columns: 1fr 110px 26px; }
  .g-entry { grid-template-columns: 112px 1fr 104px 22px; }
  .g-ro { grid-template-columns: 1fr 110px; }
  .r { text-align: right; }
  .cell { width: 100%; border: 0; background: transparent; padding: 7px 8px; margin: 0 -8px; border-radius: 8px; outline: none;
    min-width: 0; }
  .cell:hover { background: var(--soft); }
  .cell:focus { background: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .amt { display: flex; align-items: center; justify-content: flex-end; }
  .amt span { color: var(--muted); margin-right: 1px; }
  .amt .cell { text-align: right; margin: 0; padding-left: 2px; width: 90px; }
  .amt.neg .cell, .neg-txt { color: var(--bad); }
  .amt.pos .cell { color: var(--good); }
  .pos-txt { color: var(--good); }
  .x { border: 0; background: none; color: #B8BEC9; font-size: 18px; line-height: 1; padding: 4px; border-radius: 6px; }
  .x:hover { color: var(--bad); background: var(--bad-soft); }
  select.who { appearance: none; -webkit-appearance: none; border: 0; border-radius: 999px; padding: 5px 12px; font-size: 12px;
    font-weight: 700; text-align: center; background: color-mix(in srgb, var(--w) 14%, #fff); color: var(--w); width: 100%; }
  .empty { padding: 26px 20px; color: var(--muted); text-align: center; }

  /* ---------- bills */
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #CBD1DB; background: #fff; padding: 0;
    display: grid; place-items: center; }
  .check.on { background: var(--good); border-color: var(--good); }
  .check.on::after { content: ""; width: 6px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px); }
  .check.half { background: #FCC419; border-color: #FCC419; }
  .check.half::after { content: ""; width: 8px; height: 2px; background: #fff; border-radius: 2px; }
  .row.st-half, .row.st-half:hover { background: #FFF6D1; }
  .row.st-paid, .row.st-paid:hover { background: #E3F5E7; }
  .row.st-paid .cell, .row.st-half .cell { background: transparent; }
  .legend { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .move { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 6px; font-size: 11px;
    font-weight: 700; color: var(--ink2); white-space: nowrap; }
  .move:hover { border-color: var(--accent); color: var(--accent); }
  .bill-note { font-size: 11.5px; color: var(--muted); margin-top: -6px; margin-bottom: 4px; padding: 2px 8px; }
  .namecell { position: relative; }
  .add-note { position: absolute; right: 2px; top: 9px; border: 0; background: var(--soft); color: var(--muted); font-size: 11px;
    font-weight: 700; padding: 3px 8px; border-radius: 999px; opacity: 0; transition: opacity .12s; }
  .row:hover .add-note, .add-note:focus { opacity: 1; }
  .add-note:hover { color: var(--accent); background: var(--accent-soft); }
  @media (hover: none) { .add-note { opacity: .7; } }
  .yellow-sum { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px;
    border-radius: 999px; background: #FFF3BF; color: #8F6A00; margin-bottom: 8px; }
  .yellow-sum.zero { background: var(--soft); color: var(--muted); }
  .yellow-sum i { width: 9px; height: 9px; border-radius: 50%; background: #FCC419; display: inline-block; }
  .yellow-sum small { font-weight: 600; opacity: .8; }

  /* ---------- grids of panels */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start; }
  .bar { height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 999px; }
  .bar.over i { background: var(--bad); }
  .mini { display: flex; gap: 18px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .mini b { color: var(--ink); font-size: 14px; display: block; }

  /* ---------- modal + toast */
  #modal { position: fixed; inset: 0; background: rgba(16,24,40,.45); display: none; place-items: center; z-index: 50;
    padding: 20px; }
  #modal.on { display: grid; }
  .mbox { background: #fff; border-radius: 18px; padding: 22px; width: 100%; max-width: 420px;
    box-shadow: 0 20px 60px rgba(16,24,40,.25); }
  .mbox h3 { margin: 0 0 6px; font-size: 18px; }
  .mbox p { margin: 0 0 16px; color: var(--ink2); }
  .mbox input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px;
    outline: none; }
  .mbox input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .swatches { display: flex; gap: 8px; margin-bottom: 16px; }
  .swatches button { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #fff; background: var(--c);
    box-shadow: 0 0 0 1px var(--line); }
  .swatches button.on { box-shadow: 0 0 0 2px var(--c); }
  .mact { display: flex; justify-content: flex-end; gap: 8px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink);
    color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; opacity: 0; transition: .2s; z-index: 60;
    max-width: calc(100% - 32px); }
  #toast.on { opacity: 1; transform: translateX(-50%); }
  #toast a { color: #A5B8FF; }

  .seg { display: none; }
  .fline { display: grid; grid-template-columns: 1fr 120px 250px; gap: 10px; align-items: center; padding: 9px 20px; border-top: 1px solid var(--line); }
  .fline .num { text-align: right; font-weight: 700; }
  .fline.top { background: #F3FBF5; border-top: 0; }
  .fline.top .num { font-size: 18px; }
  .fline.total { background: #F7F8FA; border-top: 2px solid var(--line); }
  .fline.reserve { background: #FAFBFC; }
  .fline.reserve .neg-out { color: var(--muted); }
  .neg-out { color: #C92A2A; }
  .big2 { font-size: 22px !important; font-weight: 800 !important; }
  .fl-tools { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .mini-sel { border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; font-size: 11.5px; font-weight: 700; background: #fff; color: var(--ink2); max-width: 130px; }
  .type-sel { background: color-mix(in srgb, var(--tc) 14%, #fff); color: var(--tc); border-color: transparent; }
  .tchip { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--tc) 14%, #fff); color: var(--tc); }
  .q-panel { margin-bottom: 16px; }
  .q-row { display: block; padding: 12px 20px; }
  .q-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .qbtn { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 700; color: var(--ink2); }
  .qbtn:hover { border-color: var(--accent); color: var(--accent); }
  .qbtn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .qbtn.muted { color: var(--muted); border-style: dashed; }
  .q-hint { margin-top: 8px; font-size: 13px; font-weight: 600; color: #8F5B00; background: #FFF6D1; border-radius: 10px; padding: 8px 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .step { grid-template-columns: 28px 1fr; display: grid; padding-top: 10px; padding-bottom: 10px; }
  .stepdot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #CBD1DB; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--muted); }
  .step.done .stepdot { background: var(--good); border-color: var(--good); }
  .step.done .stepdot::after { content: ""; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .step.done > div { color: var(--muted); }
  .pie { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .pie-legend { flex: 1; min-width: 200px; }
  .lg { display: grid; grid-template-columns: 12px 1fr auto 40px; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; }
  .lg i, .lg-row i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .lg em { font-style: normal; color: var(--muted); text-align: right; font-size: 12px; }
  .trend { overflow-x: auto; margin-top: 10px; }
  .lg-row { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .lg-row span { display: inline-flex; gap: 6px; align-items: center; }
  @media (max-width: 820px) { .fline { grid-template-columns: 1fr 96px; padding-left: 14px; padding-right: 14px; } .fl-tools { grid-column: 1 / -1; justify-content: flex-start; } .q-row { padding-left: 14px; padding-right: 14px; } }
  .g-entry2 { grid-template-columns: 16px 24px 1fr 110px 110px 30px 22px; }
  .row.g-entry2, .hrow.g-entry2 { padding-left: 8px; }
  .row.cleared { background: #F3FBF5; }
  .row.cleared:hover { background: #EAF7EE; }
  .bal { text-align: right; font-weight: 700; font-size: 13px; }
  .bal.neg { color: var(--bad); }
  .kindbtn { border: 1px solid var(--line); background: #fff; border-radius: 8px; width: 28px; height: 26px; padding: 0; font-weight: 800; }
  .kindbtn.in { color: var(--good); border-color: #B2E2BE; background: var(--good-soft); }
  .kindbtn.out { color: var(--ink2); }
  .kindpick { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  .kindpick button { border: 0; background: #fff; padding: 9px 14px; font-weight: 700; font-size: 13px; color: var(--muted); }
  .kindpick button.on.out { background: var(--ink); color: #fff; }
  .kindpick button.on.in { background: var(--good); color: #fff; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px 0; gap: 10px; flex-wrap: wrap; }

<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><div class="logo">$</div>Bills</div>
    <nav id="nav">
      <button data-act="nav" data-v="cards">Cards</button>
      <button data-act="nav" data-v="joint">Joint</button>
      <button data-act="nav" data-v="bills">Monthly Bills</button>
      <button data-act="nav" data-v="money">My Money</button>
      <button data-act="nav" data-v="savings">Savings</button>
      <button data-act="nav" data-v="christmas">Christmas</button>
      <button data-act="nav" data-v="bank">Bank Sync</button>
    </nav>
    <div class="search-wrap"><input id="q" type="search" placeholder="Search all cards" autocomplete="off" aria-label="Search all cards"></div>
    <div class="top-right">
      <span id="status"></span>
      <button class="btn small" id="undoBtn" data-act="undo" disabled title="Nothing to undo">↶ Undo</button>
      <button class="btn small" data-act="backup">Back up</button>
      <button class="link" data-act="logout" title="Forget the link and passcode on this device">Log out</button>
    </div>
  </div>
</header>
<main id="app"><div class="loading">Loading your bills…</div></main>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ======================================================================= basics */
var WHO = ['Joint', 'Eric', 'Arianna', 'Split', 'Bills', 'Savings'];
var WHO_COLOR = { Joint: '#E8590C', Eric: '#1C7ED6', Arianna: '#D6336C', Split: '#7048E8', Bills: '#495057', Savings: '#2B8A3E' };
var PALETTE = { blue: '#4C6EF5', violet: '#845EF7', green: '#37B24D', orange: '#F76707', rose: '#E64980',
                slate: '#868E96', teal: '#1098AD', gold: '#F59F00' };
var S = null;                       // all data
var view = remember('view') || 'cards';
var selCard = remember('card');
var lastWho = 'Joint';
var billSide = remember('side') || '1st';
var focusAfter = null;              // selector to focus after the next render
var query = '', prevView = null, pastCharges = null, historyLoading = false;
var openLogin = {};
var openNote = {};
                  // bills whose empty note box is open                 // which bills/cards have their login section open
var showPw = {};                    // which passwords are showing

/* ---- connection to your Google script (link + passcode are kept only on this device) */
var CONN = { url: remember('url'), key: remember('key') };
function api(fn, extra) {
  var req = { key: CONN.key, fn: fn };
  if (extra) Object.keys(extra).forEach(function (k) { req[k] = extra[k]; });
  return fetch(CONN.url, {
    method: 'POST', body: JSON.stringify(req), redirect: 'follow', credentials: 'omit',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
  }).then(function (r) {
    if (!r.ok) throw new Error('Google didn’t answer (' + r.status + ').');
    return r.json();
  }).then(function (j) {
    if (!j.ok) { var e = new Error(j.error || 'Something went wrong.'); e.server = true; throw e; }
    return j.data;
  });
}
function authProblem(err) { return err && err.server && /^(PASSCODE|LOCKED|SETUP):/.test(err.message); }
function cleanMsg(m) { return String(m || '').replace(/^(PASSCODE|LOCKED|SETUP):\s*/, ''); }
function normalizeLink(v) {
  v = String(v || '').trim();
  if (/^AKfy[\w-]+$/.test(v)) return 'https://script.google.com/macros/s/' + v + '/exec';
  v = v.replace(/\/u\/\d+\//, '/').replace(/\/a\/[^/]+\/macros\//, '/macros/').replace(/[?#].*$/, '').replace(/\/dev$/, '/exec');
  return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(v) ? v : null;
}

function remember(k) { try { return localStorage.getItem('bills.' + k); } catch (e) { return null; } }
function store(k, v) { try { localStorage.setItem('bills.' + k, v); } catch (e) {} }
function forget(k) { try { localStorage.removeItem('bills.' + k); } catch (e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function r2(n) { n = +n || 0; return Math.round(Math.abs(n) * 100 + 1e-6) / 100 * (n < 0 ? -1 : 1); }
function money(n) { n = r2(n);
  return (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function plain(n) { return r2(n).toFixed(2); }
function parseAmt(v) { var n = parseFloat(String(v).replace(/[$,\s]/g, '')); return isNaN(n) ? null : Math.round(n * 100) / 100; }
function sum(list, f) { return list.reduce(function (a, x) { return a + (+f(x) || 0); }, 0); }
function uid(p) { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function byOrder(a, b) { return (+a.order || 0) - (+b.order || 0); }
// newest first: by charge date, then by when it was added (charges without a date go to the bottom)
function newestFirst(a, b) { return String(b.date || '').localeCompare(String(a.date || '')) || ((+b.order || 0) - (+a.order || 0)); }
function nextOrder(list) { return list.reduce(function (m, r) { return Math.max(m, +r.order || 0); }, 0) + 1; }
function col(name) { return PALETTE[name] || PALETTE.slate; }
function setting(id, dflt) { var s = S.Settings.filter(function (x) { return x.id === id; })[0]; return s ? s.value : dflt; }

/* ======================================================================= saving */
var queue = [], busy = false, fails = 0;
function status(text, err) { var el = document.getElementById('status'); el.textContent = text; el.className = err ? 'err' : ''; }
function send(ops) { queue = queue.concat(ops); flush(); }
function flush() {
  if (busy || !queue.length) return;
  busy = true;
  var batch = queue; queue = [];
  status('Saving…');
  api('apply', { ops: batch }).then(function () {
    busy = false; fails = 0; if (queue.length) flush(); else status('All changes saved');
  }, function (e) {
    busy = false; fails++;
    queue = batch.concat(queue);
    if (authProblem(e)) { status('Not saved', true); showConnect(cleanMsg(e.message)); return; }
    if (fails >= 5) { status('Not saved. Check your connection and reload.', true); return; }
    status('Couldn’t save, retrying…', true);
    setTimeout(flush, 1500 * fails);
  });
}
window.addEventListener('beforeunload', function (e) { if (busy || queue.length) { e.preventDefault(); e.returnValue = ''; } });

/* ---- undo: every change remembers how to put things back. Changes made in one go (one click,
   one drag, clearing a card) are undone together. */
var undoStack = [], undoGroup = null, undoLabel = '', replaying = false;
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function remember_(inverse) {
  if (replaying) return;
  if (!undoGroup) {
    undoGroup = { label: undoLabel || 'last change', ops: [] };
    undoStack.push(undoGroup);
    if (undoStack.length > 50) undoStack.shift();
    setTimeout(function () { undoGroup = null; undoLabel = ''; updateUndo(); }, 0);
  }
  undoGroup.ops.push(inverse);
}
function updateUndo() {
  var b = document.getElementById('undoBtn'); if (!b) return;
  var last = undoStack[undoStack.length - 1];
  b.disabled = !last; b.title = last ? 'Undo ' + last.label + ' (Ctrl+Z)' : 'Nothing to undo';
}
function undo() {
  var g = undoStack.pop();
  if (!g) { toast('Nothing to undo'); return; }
  replaying = true;
  g.ops.slice().reverse().forEach(function (o) {
    if (o.op === 'upsert') upsert(o.table, clone(o.row)); else removeRow(o.table, o.id);
  });
  replaying = false;
  updateUndo(); render();
  toast('Undid ' + esc(g.label) + (undoStack.length ? ' <button class="toast-btn" data-act="undo">Undo more</button>' : ''), 4000);
}

function upsert(table, row) {
  var list = S[table];
  if (!list) {   // a table the page doesn't keep a copy of (History): just save it
    remember_({ op: 'remove', table: table, id: row.id });
    if (table === 'History' && pastCharges !== null) pastCharges = pastCharges.filter(function (r) { return r.id !== row.id; }).concat([row]);
    send([{ op: 'upsert', table: table, row: clone(row) }]);
    return;
  }
  var i = -1;
  for (var k = 0; k < list.length; k++) if (list[k].id === row.id) { i = k; break; }
  if (i >= 0) { remember_({ op: 'upsert', table: table, row: clone(list[i]) }); Object.keys(row).forEach(function (f) { list[i][f] = row[f]; }); row = list[i]; }
  else { remember_({ op: 'remove', table: table, id: row.id }); list.push(row); }
  send([{ op: 'upsert', table: table, row: clone(row) }]);
}
function removeRow(table, id) {
  if (S[table]) {
    var gone = S[table].filter(function (r) { return r.id === id; })[0];
    if (gone) remember_({ op: 'upsert', table: table, row: clone(gone) });
    S[table] = S[table].filter(function (r) { return r.id !== id; });
  } else if (table === 'History' && pastCharges !== null) {
    pastCharges = pastCharges.filter(function (r) { return r.id !== id; });
  }
  send([{ op: 'remove', table: table, id: id }]);
}
function removeIds(table, ids) {
  var drop = {}; ids.forEach(function (i) { drop[i] = true; });
  S[table].filter(function (r) { return drop[r.id]; }).forEach(function (r) { remember_({ op: 'upsert', table: table, row: clone(r) }); });
  S[table] = S[table].filter(function (r) { return !drop[r.id]; });
  if (ids.length) send([{ op: 'removeIds', table: table, ids: ids }]);
}
function removeWhere(table, field, value) {
  S[table].filter(function (r) { return String(r[field]) === String(value); })
    .forEach(function (r) { remember_({ op: 'upsert', table: table, row: clone(r) }); });
  S[table] = S[table].filter(function (r) { return String(r[field]) !== String(value); });
  send([{ op: 'removeWhere', table: table, field: field, value: value }]);
}

/* ======================================================================= math */
function pendingMath() {
  var P = S.Pending || [], by = {};
  WHO.forEach(function (w) { by[w] = sum(P.filter(function (p) { return p.who === w; }), function (p) { return p.amount; }); });
  return { all: sum(P, function (p) { return p.amount; }), n: P.length,
           eric: by.Eric + by.Split / 2, arianna: by.Arianna + by.Split / 2, joint: by.Joint,
           unlabeled: P.filter(function (p) { return WHO.indexOf(p.who) < 0; }).length };
}
function calc() {
  var tag = {};
  var live = S.Charges.filter(function (c) { return !c.hold; });     // charges on hold don't count anywhere
  WHO.forEach(function (w) { tag[w] = sum(live.filter(function (c) { return c.who === w; }), function (c) { return c.amount; }); });
  var onCards = sum(live, function (c) { return c.amount; });
  var tagged = sum(WHO, function (w) { return tag[w]; });
  var inJoint = sum(S.Joint, function (j) { return j.amount; });
  var b1 = S.Bills.filter(function (b) { return b.payOn === '1st'; });
  var b15 = S.Bills.filter(function (b) { return b.payOn === '15th'; });
  var us1 = sum(b1, function (b) { return b.us; }), us15 = sum(b15, function (b) { return b.us; });
  var ourTotal = us1 + us15, half = ourTotal / 2;
  return {
    tag: tag, onCards: onCards, untagged: Math.round((onCards - tagged) * 100) / 100,
    needN: live.filter(function (c) { return WHO.indexOf(c.who) < 0; }).length,
    held: S.Charges.filter(function (c) { return c.hold; }),
    pend: pendingMath(),
    eric: tag.Eric + tag.Split / 2, arianna: tag.Arianna + tag.Split / 2,
    inJoint: inJoint, cash: sum(S.JointCash || [], function (j) { return j.amount; }),
    jointLeft: inJoint - tag.Joint - sum(S.JointCash || [], function (j) { return j.amount; }),
    us1: us1, us15: us15, tot1: sum(b1, function (b) { return b.total; }), tot15: sum(b15, function (b) { return b.total; }),
    ourTotal: ourTotal, half: half, paycheck: half / 2, bank: half - us15,
    ferris: sum(S.Bills, function (b) { return b.total; }) - ourTotal,
    unpaid: ourTotal - sum(S.Bills.filter(function (b) { return b.status === 'paid'; }), function (b) { return b.us; })
  };
}

/* ======================================================================= pieces */
function tile(label, value, opts) {
  opts = opts || {};
  var cls = opts.sign && value < 0 ? ' neg' : '';
  return '<div class="tile' + (opts.act ? ' click' : '') + '"' + (opts.act ? ' data-act="nav" data-v="' + opts.act + '"' : '') + '>' +
    '<div class="lbl">' + esc(label) + '</div><div class="val num' + cls + '">' + money(value) + '</div>' +
    (opts.hint ? '<div class="hint' + (opts.warn ? ' warn' : '') + '">' + esc(opts.hint) + '</div>' : '') + '</div>';
}
function amtCell(table, id, field, value, extraCls) {
  return '<div class="amt' + (value < 0 ? ' neg' : '') + (extraCls ? ' ' + extraCls : '') + '"><span>$</span>' +
    '<input class="cell num" inputmode="decimal" data-t="' + table + '" data-id="' + id + '" data-f="' + field +
    '" value="' + plain(value) + '"></div>';
}
function textCell(table, id, field, value, ph, cls) {
  return '<input class="cell' + (cls ? ' ' + cls : '') + '" data-t="' + table + '" data-id="' + id + '" data-f="' + field + '" value="' + esc(value) +
    '" placeholder="' + esc(ph || '') + '">';
}
function whoSelect(c, table) {
  return '<select class="who' + (c.who ? '' : ' blank') + '" style="--w:' + (WHO_COLOR[c.who] || '#8F5B00') + '" data-t="' + (table || 'Charges') + '" data-id="' + esc(c.id) + '" data-f="who">' +
    (c.who ? '' : '<option value="" selected>Who?</option>') +
    WHO.map(function (w) { return '<option' + (w === c.who ? ' selected' : '') + '>' + w + '</option>'; }).join('') + '</select>';
}
function shortDate(d) {
  if (!d) return '';
  var x = new Date(d + 'T12:00:00'); return isNaN(x) ? d : x.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

var GRIP_SVG = '<svg viewBox="0 0 10 16" fill="currentColor"><circle cx="2.5" cy="2.5" r="1.5"/><circle cx="7.5" cy="2.5" r="1.5"/><circle cx="2.5" cy="8" r="1.5"/><circle cx="7.5" cy="8" r="1.5"/><circle cx="2.5" cy="13.5" r="1.5"/><circle cx="7.5" cy="13.5" r="1.5"/></svg>';
var KEY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2M16 7l3 3M18.5 4.5l2 2"/></svg>';
function hasLogin(r) { return !!(r.url || r.username || r.password); }
function keyButton(table, r) {
  return '<button class="key' + (hasLogin(r) ? ' has' : '') + (openLogin[r.id] ? ' open' : '') + '" title="Website, username and password" data-act="login" data-t="' + table + '" data-id="' + r.id + '">' + KEY_SVG + '</button>';
}
function fixUrl(u) { u = String(u || '').trim(); return !u ? '' : /^https?:\/\//i.test(u) ? u : 'https://' + u; }
function loginBox(table, r) {
  var f = function (field, ph, type) {
    return '<input class="cell" type="' + (type || 'text') + '" autocomplete="off" data-t="' + table + '" data-id="' + r.id + '" data-f="' + field + '" value="' + esc(r[field]) + '" placeholder="' + esc(ph) + '">';
  };
  return '<div class="login">' +
    '<label>Website</label><div class="lf">' + f('url', 'e.g. nationalgrid.com') +
      (r.url ? '<a class="btn small" href="' + esc(fixUrl(r.url)) + '" target="_blank" rel="noopener">Open</a>' : '') + '</div>' +
    '<label>Username</label><div class="lf">' + f('username', 'Username or email') +
      '<button class="btn small" data-act="copy" data-t="' + table + '" data-id="' + r.id + '" data-f="username">Copy</button></div>' +
    '<label>Password</label><div class="lf">' + f('password', 'Password', showPw[r.id] ? 'text' : 'password') +
      '<button class="btn small" data-act="showpw" data-id="' + r.id + '">' + (showPw[r.id] ? 'Hide' : 'Show') + '</button>' +
      '<button class="btn small" data-act="copy" data-t="' + table + '" data-id="' + r.id + '" data-f="password">Copy</button></div>' +
    '</div>';
}
function copyText(text) {
  function fallback() {
    var t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(t); toast(ok ? 'Copied' : 'Couldn’t copy. Tap Show and copy it by hand.');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast('Copied'); }, fallback);
  } else fallback();
}

/* ======================================================================= views */
function viewCards(m) {
  var cards = S.Cards.slice().sort(byOrder);
  if (!cards.some(function (c) { return c.id === selCard; })) selCard = cards.length ? cards[0].id : null;
  var h = '<h1>Cards</h1><p class="sub">Tag each charge with who it belongs to. Everything adds up on its own.</p>';
  h += '<div class="tiles">' +
    tile('Eric owes', m.eric, { hint: m.pend.eric ? 'With pending: ' + money(m.eric + m.pend.eric) : 'His charges + half of Split' }) +
    tile('Arianna owes', m.arianna, { hint: m.pend.arianna ? 'With pending: ' + money(m.arianna + m.pend.arianna) : 'Her charges + half of Split' }) +
    tile('Joint money left', m.jointLeft, { sign: true, act: 'joint', hint: m.pend.joint ? 'After pending: ' + money(m.jointLeft - m.pend.joint) : 'Tap to change what’s in the joint' }) +
    tile('Bills on cards', m.tag.Bills, { hint: 'Already in the monthly budget' }) +
    tile('Total on all cards', m.onCards, { hint: m.needN ? m.needN + (m.needN === 1 ? ' charge needs' : ' charges need') + ' a person' :
      (m.held.length ? money(sum(m.held, function (x) { return x.amount; })) + ' on hold, not counted' :
      (m.pend.n ? '+ ' + money(m.pend.all) + ' pending' : 'Every charge has a person')), warn: !!m.needN }) +
    '</div>';

  h += '<div class="pills">';
  cards.forEach(function (c) {
    var t = sum(S.Charges.filter(function (x) { return x.cardId === c.id && !x.hold; }), function (x) { return x.amount; });
    h += '<button class="pill' + (c.id === selCard ? ' on' : '') + '" style="--c:' + col(c.color) + '" data-act="card" data-id="' + c.id + '">' +
      '<span class="pname">' + esc(c.name) + (c.paid ? ' <span class="badge">Paid</span>' : '') +
      (function () { var n = S.Charges.filter(function (x) { return x.cardId === c.id && !x.who && !x.hold; }).length; return n ? ' <span class="badge warn">' + n + ' new</span>' : ''; })() + '</span>' +
      '<span class="ptot num">' + money(t) + '</span>' +
      (function () { var pp = (S.Pending || []).filter(function (x) { return x.cardId === c.id; }); return pp.length ? '<span class="ppend">+ ' + money(sum(pp, function (x) { return x.amount; })) + ' pending</span>' : ''; })() +
      '</button>';
  });
  h += '<button class="pill add" data-act="addcard">+ Add card</button></div>';

  var card = cards.filter(function (c) { return c.id === selCard; })[0];
  if (!card) return h + '<div class="panel"><div class="empty">Add your first card to get started.</div></div>';
  var items = S.Charges.filter(function (x) { return x.cardId === card.id; }).sort(newestFirst);
  var liveItems = items.filter(function (x) { return !x.hold; }), heldItems = items.filter(function (x) { return x.hold; });
  var total = sum(liveItems, function (x) { return x.amount; });
  var heldTotal = sum(heldItems, function (x) { return x.amount; });

  h += '<section class="panel" style="--c:' + col(card.color) + '"><div class="phead">' +
    '<div class="grow"><div class="eyebrow">Card</div>' + textCell('Cards', card.id, 'name', card.name, '', 'title-in') +
    '<button class="btn small" style="margin-top:6px" data-act="login" data-t="Cards" data-id="' + card.id + '">' + KEY_SVG.replace('<svg', '<svg style="width:13px;height:13px;vertical-align:-2px;margin-right:5px"') + (openLogin[card.id] ? 'Hide login' : 'Login info' + (hasLogin(card) ? ' ✓' : '')) + '</button></div>' +
    '<div class="big num">' + money(total) + '<small>' + liveItems.length + ' charge' + (liveItems.length === 1 ? '' : 's') +
      (heldItems.length ? ' · ' + money(heldTotal) + ' on hold' : '') + '</small></div>' +
    '</div>';
  if (openLogin[card.id]) h += loginBox('Cards', card);
  var parts = WHO.map(function (w) {
    var t = sum(liveItems.filter(function (x) { return x.who === w; }), function (x) { return x.amount; });
    return t ? '<span class="bk" style="color:' + WHO_COLOR[w] + '">' + w + ' <b>' + money(t) + '</b></span>' : '';
  }).join('');
  var needN = liveItems.filter(function (x) { return !x.who; }).length;
  if (needN) parts = '<span class="bk warn">' + needN + (needN === 1 ? ' needs' : ' need') + ' a person <b>' + money(sum(liveItems.filter(function (x) { return !x.who; }), function (x) { return x.amount; })) + '</b></span>' + parts;
  if (heldItems.length) parts += '<span class="bk hold">On hold (not counted) <b>' + money(heldTotal) + '</b></span>';
  if (parts) h += '<div class="breakdown">' + parts + '</div>';

  h += '<form class="addrow" data-form="charge" data-card="' + card.id + '">' +
    '<input class="f-item" name="item" placeholder="What was it?" autocomplete="off" id="add-item">' +
    '<input class="f-amt num" name="amount" placeholder="0.00" inputmode="decimal" autocomplete="off">' +
    '<div class="whopick">' + WHO.map(function (w) {
      return '<button type="button" style="--w:' + WHO_COLOR[w] + '" class="' + (w === lastWho ? 'on' : '') + '" data-act="pickwho" data-w="' + w + '" title="Enter picks this person, Enter again adds the charge">' + w + '</button>';
    }).join('') + '</div>' +
    '<button class="btn primary" type="submit">Add</button></form>';

  var pend = (S.Pending || []).filter(function (x) { return x.cardId === card.id; })
    .sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
  if (pend.length) {
    h += '<div class="pend-head"><b>Pending at the bank · ' + money(sum(pend, function (x) { return x.amount; })) + '</b>' +
      '<span>Not in the totals yet. Label them to see what’s coming. When one posts it moves up into the charges.</span></div><div class="rows pend">';
    pend.forEach(function (x) {
      h += '<div class="row g-charge" data-charge="' + esc(x.id) + '"><div></div><div><div class="item" style="padding:7px 0">' + esc(x.item) + '<span class="pchip">pending</span></div>' +
        (x.date ? '<div class="sub2">' + shortDate(x.date) + '</div>' : '') + '</div>' +
        '<div class="r num' + (x.amount < 0 ? ' neg-txt' : '') + '">' + money(x.amount) + '</div>' + whoSelect(x, 'Pending') + '<div></div></div>';
    });
    h += '</div>';
  }
  if (items.length) {
    h += '<div class="hrow g-charge"><div title="Check to put a charge on hold">Hold</div><div>Item</div><div class="r">Amount</div><div style="text-align:center">Who</div><div></div></div><div class="rows">';
    var typed = items.filter(function (y) { return !y.bankId; });
    items.forEach(function (x) {
      var dup = x.bankId && typed.some(function (y) { return Math.abs(y.amount - x.amount) < 0.005; });
      var info = (x.hold ? '<span class="hchip">on hold</span> ' : '') + (x.date ? shortDate(x.date) : '') + (x.bankId ? (x.date ? ' · ' : '') + 'from bank' : '') +
        (dup ? ' · <span class="dup">same amount as one you typed. Repeat?</span>' : '');
      h += '<div class="row g-charge' + (x.hold ? ' held' : x.who ? '' : ' needs') + '" data-charge="' + x.id + '">' +
        '<button class="holdbox' + (x.hold ? ' on' : '') + '" data-act="hold" data-id="' + x.id + '" title="' + (x.hold ? 'On hold. Click to count it again' : 'Put on hold (not counted, stays when you clear the card)') + '"></button>' +
        '<div>' + textCell('Charges', x.id, 'item', x.item) +
        (info ? '<div class="sub2">' + info + '</div>' : '') + '</div>' + amtCell('Charges', x.id, 'amount', x.amount) +
        whoSelect(x) + '<button class="x" title="Delete" data-act="del" data-t="Charges" data-id="' + x.id + '">×</button></div>';
    });
    h += '</div>';
  } else {
    h += '<div class="empty">No charges on this card.</div>';
  }
  h += '<div class="pfoot"><div class="pactions">' +
    '<button class="btn' + (card.paid ? ' primary' : '') + '" data-act="paid" data-id="' + card.id + '">' + (card.paid ? '✓ Paid' : 'Mark as paid') + '</button>' +
    '<button class="btn" data-act="clearcard" data-id="' + card.id + '"' + (liveItems.length ? '' : ' disabled') + '>Clear charges</button>' +
    '</div><button class="link danger" data-act="delcard" data-id="' + card.id + '">Delete this card</button></div></section>';
  return h;
}

    tile('Left', m.jointLeft, { sign: true, hint: m.pend.joint ? 'After pending: ' + money(m.jointLeft - m.pend.joint) : '' }) + '</div>';
  var rows = S.Joint.slice().sort(byOrder);
  h += '<div class="cols"><section class="panel" style="--c:#E8590C"><div class="phead"><div class="grow"><div class="eyebrow">Money in</div>' +

  h += '<div style="display:grid;gap:16px">';

    '<input class="f-amt num" name="amount" placeholder="0.00" inputmode="decimal" autocomplete="off"><button class="btn primary">Add</button></form><div class="rows">';
  h += cash.length ? cash.map(function (j) {
    return '<div class="row g-two"><div>' + textCell('JointCash', j.id, 'item', j.item) + (j.date ? '<div class="sub2">' + shortDate(j.date) + ' · out of pocket</div>' : '') + '</div>' +
      amtCell('JointCash', j.id, 'amount', j.amount) + '<button class="x" data-act="del" data-t="JointCash" data-id="' + j.id + '">×</button></div>';

      '<div class="r num' + (c.amount < 0 ? ' neg-txt' : '') + '"' + (pending ? ' style="color:var(--muted)"' : '') + '>' + money(c.amount) + '</div></div>';

  h += '</div></section></div></div>';
  return h;
}

function billColumn(payOn, color, m) {
  var other = payOn === '1st' ? '15th' : '1st';
  var rows = S.Bills.filter(function (b) { return b.payOn === payOn; }).sort(byOrder);
  var us = payOn === '1st' ? m.us1 : m.us15, tot = payOn === '1st' ? m.tot1 : m.tot15;
  var left = rows.filter(function (b) { return b.status !== 'paid'; }).length;
  var yel = rows.filter(function (b) { return b.status === 'half'; });
  var halfway = yel.length;
  var yUs = sum(yel, function (b) { return b.us; }), yTot = sum(yel, function (b) { return b.total; });
  var h = '<section class="panel" style="--c:' + color + '"><div class="phead"><div class="grow">' +
    '<div class="yellow-sum' + (halfway ? '' : ' zero') + '" title="Bills marked yellow in this column"><i></i>Yellow: <span class="num">' + money(yUs) + '</span>' +
    (halfway && Math.abs(yTot - yUs) > 0.004 ? ' <small>(' + money(yTot) + ' total)</small>' : '') + '</div>' +
    '<div class="eyebrow">Paid on the</div>' +
    '<div style="font-size:26px;font-weight:800;letter-spacing:-.5px">' + payOn + '</div></div>' +
    '<div class="big num">' + money(us) + '<small>our part · ' + money(tot) + ' total</small></div></div>';
  h += '<div class="breakdown"><span class="bk">' + (left ? left + ' not paid yet' : 'All paid') + '</span>' +
    (halfway ? '<span class="bk" style="background:#FFF3BF;color:#8F6A00">' + halfway + ' yellow</span>' : '') +
    (rows.some(function (b) { return b.status; }) ? '<button class="link" data-act="uncheck" data-p="' + payOn + '">Clear all colors for next month</button>' : '') + '</div>';
  h += '<div class="hrow g-bill"><div></div><div></div><div>Bill</div><div class="r c-total">Total</div><div class="r">Our part</div><div></div><div></div><div></div></div><div class="rows" data-pay="' + payOn + '" data-dtable="Bills" data-dfield="payOn" data-dgroup="' + payOn + '">';
  rows.forEach(function (b) {
    var st = b.status === 'paid' ? ' st-paid' : b.status === 'half' ? ' st-half' : '';
    h += '<div class="row g-bill' + st + '" data-bill="' + b.id + '" data-did="' + b.id + '">' +
      '<span class="grip" title="Drag to reorder" data-grip="' + b.id + '">' + GRIP_SVG + '</span>' +
      '<button class="check' + (b.status === 'paid' ? ' on' : b.status === 'half' ? ' half' : '') + '" title="Tap: yellow, tap again: green, again: clear" data-act="billpaid" data-id="' + b.id + '"></button>' +
      '<div class="namecell">' + textCell('Bills', b.id, 'name', b.name) +
        (b.note || openNote[b.id] ? textCell('Bills', b.id, 'note', b.note, 'Type a note', 'bill-note') :
          '<button class="add-note" data-act="addnote" data-id="' + b.id + '" title="Add a note under this bill">+ note</button>') + '</div>' +
      amtCell('Bills', b.id, 'total', b.total, 'c-total') + amtCell('Bills', b.id, 'us', b.us) + keyButton('Bills', b) +
      '<button class="move" data-act="move" data-id="' + b.id + '" title="Move to the ' + other + '">' + (payOn === '1st' ? 'to 15th →' : '← to 1st') + '</button>' +
      '<button class="x" data-act="del" data-t="Bills" data-id="' + b.id + '">×</button></div>';
    if (openLogin[b.id]) h += loginBox('Bills', b);
  });
  if (!rows.length) h += '<div class="empty">No bills on the ' + payOn + '.</div>';
  h += '</div><form class="addrow" data-form="bill" data-p="' + payOn + '">' +
    '<input class="f-item" name="name" placeholder="New bill" id="add-bill-' + payOn + '" autocomplete="off">' +
    '<input class="f-amt num" name="total" placeholder="Total" inputmode="decimal" autocomplete="off">' +
    '<input class="f-amt num" name="us" placeholder="Our part" inputmode="decimal" autocomplete="off">' +
    '<input class="f-item" name="note" placeholder="Note (optional)" autocomplete="off">' +
    '<button class="btn primary">Add</button></form></section>';
  return h;
}

  h += '<div class="tiles">' +
    tile('Our total', m.ourTotal, { hint: '1st + 15th, our part' }) +

    tile('Each paycheck', m.paycheck) +
    tile('Put in bank', m.bank, { hint: 'Half minus the 15th bills' }) +
    tile('Ferris pays', m.ferris) +
    tile('Still unpaid', m.unpaid, { hint: 'Our part' }) + '</div>';
  h += '<div class="seg">' + ['1st', '15th'].map(function (p) {

function viewSavings() {
  var funds = S.Funds.slice().sort(byOrder);
  var total = sum(S.FundEntries, function (e) { return e.amount; });
  var h = '<h1>Specialty Savings</h1><p class="sub">Add money in or take money out of each fund.</p>';
  h += '<div class="tiles">' + tile('Total in savings', total);
  funds.slice(0, 3).forEach(function (f) {
    h += tile(f.name, sum(S.FundEntries.filter(function (e) { return e.fundId === f.id; }), function (e) { return e.amount; }));
  });
  h += '</div><div class="grid">';
  funds.forEach(function (f) {
    var es = S.FundEntries.filter(function (e) { return e.fundId === f.id; }).sort(byOrder).reverse();
    var bal = sum(es, function (e) { return e.amount; });

      textCell('Funds', f.id, 'name', f.name, '', 'title-in') + '</div><div class="big num">' + money(bal) + '</div></div>';
    h += '<form class="addrow" data-form="entry" data-fund="' + f.id + '">' +
      '<input class="f-date" type="date" name="date" value="' + today() + '">' +
      '<input class="f-amt num" name="amount" placeholder="0.00" inputmode="decimal" autocomplete="off">' +
      '<input class="f-item" name="note" placeholder="Note (optional)" autocomplete="off">' +
      '<button class="btn primary" data-dir="in">+ In</button><button class="btn" data-dir="out">− Out</button></form>';
    h += '<div class="rows">' + (es.length ? es.map(function (e) {
      return '<div class="row g-entry"><input class="cell" type="date" data-t="FundEntries" data-id="' + e.id + '" data-f="date" value="' + esc(e.date) + '">' +
        textCell('FundEntries', e.id, 'note', e.note, '—') + amtCell('FundEntries', e.id, 'amount', e.amount, e.amount >= 0 ? 'pos' : '') +
        '<button class="x" data-act="del" data-t="FundEntries" data-id="' + e.id + '">×</button></div>';
    }).join('') : '<div class="empty">Nothing here yet.</div>') + '</div>';

  });

  var people = S.People.slice().sort(byOrder);
  var budget = parseAmt(setting('christmasBudget', '0')) || 0;
  var spent = sum(S.Gifts, function (g) { return g.amount; });
  var perPerson = sum(people, function (p) { return p.budget; });

/* ======================================================================= My Money (your own M&T checking) */
var TYPES = ['Gas', 'Groceries', 'Eating out', 'Shopping', 'Subscriptions', 'Bills', 'Other'];
var TYPE_COLOR = { 'Gas': '#F76707', 'Groceries': '#37B24D', 'Eating out': '#E64980', 'Shopping': '#4C6EF5',
                   'Subscriptions': '#845EF7', 'Bills': '#1098AD', 'Other': '#ADB5BD' };
var TYPE_WORDS = [
  ['Gas', /shell|sunoco|exxon|mobil|\bbp\b|speedway|citgo|valero|stewart|fastrac|kwik|gulf|\bgas\b|fuel/i],
  ['Groceries', /wegmans|aldi|\btops\b|price chopper|trader joe|walmart|\bbj'?s\b|costco|grocer|market|hannaford|kroger|save a lot|wholesale/i],
  ['Eating out', /7 ?brew|starbucks|bucks|\btims?\b|horton|dunkin|mcdonald|burger|panera|\bdq\b|dairy queen|chick|taco|pizza|restaurant|cafe|coffee|grill|kin ?pin|dickey|china|mighty|subway|wendy|doordash|uber ?eats|grubhub|diner|bagel|bar\b/i],
  ['Subscriptions', /hulu|netflix|spotify|apple|roku|disney ?\+|disney plus|prime video|cloudflare|youtube|icloud|paramount|peacock|max\.com/i],
  ['Shopping', /target|amazon|homegoods|tj ?maxx|marshalls|ebay|walgreens|cvs|best buy|etsy|kohl|old navy|michaels|lowe|home depot|scholastic|petsmart|chewy/i]
];
var mmShowDeposits = false;

function storeKey(name) {
  return String(name || '').toLowerCase().replace(/[#*]/g, ' ').replace(/\d+/g, ' ').replace(/[^a-z&' ]+/g, ' ')
    .replace(/\b(inc|llc|store|the|co)\b/g, ' ').replace(/\s+/g, ' ').trim().split(' ').slice(0, 2).join(' ') || 'other';
}
function typeOf(name) {
  var rule = (S.TypeRules || []).filter(function (r) { return r.id === storeKey(name); })[0];
  if (rule && rule.type) return rule.type;
  for (var i = 0; i < TYPE_WORDS.length; i++) if (TYPE_WORDS[i][1].test(name || '')) return TYPE_WORDS[i][0];
  return 'Other';
}
function checkingAccounts() { return (S.BankAccounts || []).filter(function (a) { return a.cardId === 'checking'; }); }

function moneyMath(m) {
  var C = S.Checking || [];
  var cur = C.filter(function (r) { return !r.period; });
  var abs = function (list) { return sum(list, function (r) { return Math.abs(r.amount); }); };
  var cardsById = {}; S.Cards.forEach(function (c) { cardsById[c.id] = c; });
  // money that is only passing through (pairs that were matched up are left out)
  var passSit = sum(C.filter(function (r) { return r.kind === 'pass' && !r.pairId; }), function (r) { return r.amount; });
  var unDep = C.filter(function (r) { return r.amount > 0 && !r.kind; });
  var unOut = C.filter(function (r) { return r.amount < 0 && !r.kind; });
  var spendRows = cur.filter(function (r) { return r.amount < 0 && (r.kind === 'spend' || !r.kind); });
  var cardRows = cur.filter(function (r) { return r.kind === 'cards'; });
  var billsRows = cur.filter(function (r) { return r.kind === 'bills'; });
  var saveRows = cur.filter(function (r) { return r.kind === 'savings'; });
  var payRows = cur.filter(function (r) { return r.amount > 0 && r.kind === 'real'; });
  // pending charges you counted in a pay period you already closed: when they post, they aren't counted twice
  var closedPend = closedPending(), usedPend = {}, alreadyCounted = [];
  var stillPending = {}; (S.Pending || []).forEach(function (p) { stillPending[p.bankId] = 1; });
  closedPend.forEach(function (p, i) { if (p.bankId && stillPending[p.bankId]) usedPend[i] = 'waiting'; });
  var mine = function (c) { return c.who === 'Eric' || c.who === 'Split'; };
  var toLine = function (c, pending) {
    return { id: c.id, name: c.item, date: c.date || '', amount: c.who === 'Split' ? c.amount / 2 : +c.amount, full: +c.amount,
             split: c.who === 'Split', from: (cardsById[c.cardId] || { name: 'Card' }).name, src: 'card', pending: pending };
  };
  var cardLines = S.Charges.filter(function (c) {
      if (c.hold || c.settled || !mine(c)) return false;
      for (var i = 0; i < closedPend.length; i++) {
        var p = closedPend[i];
        if (!usedPend[i] && p.cardId === c.cardId && Math.abs(p.amount - c.amount) < 0.01) { usedPend[i] = 1; alreadyCounted.push(c.id); return false; }
      }
      return true;
    }).map(function (c) { return toLine(c, false); })
    .concat((S.Pending || []).filter(function (c) {
      return mine(c) && !closedPend.some(function (p) { return p.bankId && p.bankId === c.bankId; });
    }).map(function (c) { return toLine(c, true); }));
  var owed = sum(cardLines, function (l) { return l.amount; });
  var cardsDone = abs(cardRows), billsDone = abs(billsRows), saved = abs(saveRows), spent = abs(spendRows);
  var billsAmt = r2(m.paycheck);
  // the bills amount is set aside once this period's paycheck is in, until the bills transfer shows up
  var reserve = billsRows.length || !payRows.length ? 0 : billsAmt;
  var bal = sum(checkingAccounts(), function (a) { return a.balance; });
  var unDepAmt = sum(unDep, function (r) { return r.amount; });
  var cardLeft = Math.max(0, owed - cardsDone);            // card money not sent to the joint yet
  var cardExtra = Math.max(0, cardsDone - owed);           // sent for charges that were already cleared
  var really = bal - passSit - unDepAmt - cardLeft - reserve;
  var lines = owed + spent + (billsRows.length ? billsDone : reserve) + saved + cardExtra;
  return {
    bal: bal, passSit: passSit, unDep: unDep, unOut: unOut, unDepAmt: unDepAmt, cur: cur, spendRows: spendRows, cardRows: cardRows,
    billsRows: billsRows, saveRows: saveRows, payRows: payRows, cardLines: cardLines, alreadyCounted: alreadyCounted, usedPend: usedPend, closedPend: closedPend, owed: owed, cardsDone: cardsDone,
    billsDone: billsDone, saved: saved, spent: spent, billsAmt: billsAmt, reserve: reserve, cardLeft: cardLeft, cardExtra: cardExtra,
    really: really, top: really + lines
  };
}

function typeTotals(mm) {
  var t = {};
  TYPES.forEach(function (k) { t[k] = 0; });
  mm.cardLines.forEach(function (l) { t[typeOf(l.name)] += l.amount; });
  mm.spendRows.forEach(function (r) { t[typeOf(r.name)] += Math.abs(r.amount); });
  t.Bills += mm.billsRows.length ? mm.billsDone : mm.reserve;
  if (mm.cardExtra) t.Other += mm.cardExtra;
  return t;
}

function donut(t) {
  var total = sum(TYPES, function (k) { return Math.max(0, t[k]); });
  if (total <= 0) return '<div class="empty">No spending yet this pay period.</div>';
  var R = 70, r = 44, cx = 80, cy = 80, a0 = -Math.PI / 2, paths = '';
  TYPES.forEach(function (k) {
    var v = Math.max(0, t[k]); if (!v) return;
    var a1 = a0 + v / total * Math.PI * 2, big = a1 - a0 > Math.PI ? 1 : 0;
    if (v / total > 0.9999) { paths += '<circle cx="80" cy="80" r="57" fill="none" stroke="' + TYPE_COLOR[k] + '" stroke-width="26"/>'; a0 = a1; return; }
    var p = function (rad, a) { return (cx + rad * Math.cos(a)).toFixed(2) + ' ' + (cy + rad * Math.sin(a)).toFixed(2); };
    paths += '<path d="M' + p(R, a0) + ' A' + R + ' ' + R + ' 0 ' + big + ' 1 ' + p(R, a1) + ' L' + p(r, a1) + ' A' + r + ' ' + r + ' 0 ' + big + ' 0 ' + p(r, a0) + ' Z" fill="' + TYPE_COLOR[k] + '"/>';
    a0 = a1;
  });
  var legend = TYPES.filter(function (k) { return t[k] > 0; }).sort(function (a, b) { return t[b] - t[a]; }).map(function (k) {
    return '<div class="lg"><i style="background:' + TYPE_COLOR[k] + '"></i><span>' + k + '</span><b class="num">' + money(t[k]) + '</b><em>' + Math.round(t[k] / total * 100) + '%</em></div>';
  }).join('');
  return '<div class="pie"><svg viewBox="0 0 160 160" width="160" height="160">' + paths +
    '<text x="80" y="76" text-anchor="middle" font-size="11" fill="#7B8494">spent</text><text x="80" y="94" text-anchor="middle" font-size="15" font-weight="800" fill="#161B26">' +
    money(total).replace('.00', '') + '</text></svg><div class="pie-legend">' + legend + '</div></div>';
}

function trendBars(mm) {
  var P = (S.Periods || []).slice().sort(function (a, b) { return String(a.endDate).localeCompare(String(b.endDate)); }).slice(-11);
  var cols = P.map(function (p) { return { label: shortDate(p.endDate), spent: p.cards + p.spend + p.bills, saved: p.saved }; });

  if (cols.length < 2) return '<div class="empty" style="padding:14px 0">Your trend fills in after your first close-out.</div>';
  var max = Math.max.apply(null, cols.map(function (c) { return Math.max(c.spent, c.saved); }).concat([1]));
  var W = 36, gap = 18, H = 120, w = cols.length * (W + gap);

      '<text x="' + (x + 17) + '" y="' + (H + 16) + '" text-anchor="middle" font-size="10" fill="#7B8494">' + esc(c.label) + '</text>';
  }).join('');
  return '<div class="trend"><svg viewBox="0 0 ' + w + ' ' + (H + 22) + '" width="' + w + '" height="' + (H + 22) + '">' + bars + '</svg></div>' +
    '<div class="lg-row"><span><i style="background:#E64980"></i>Spent</span><span><i style="background:#37B24D"></i>Saved</span></div>';
}

function closedPending() { try { return JSON.parse(setting('closedPending', '') || '[]'); } catch (e) { return []; } }
function daysAgo(n) { var x = new Date(); x.setDate(x.getDate() - n); return x.getFullYear() + '-' + ('0' + (x.getMonth() + 1)).slice(-2) + '-' + ('0' + x.getDate()).slice(-2); }

function closePeriod() {
  var mm = moneyMath(calc()), pid = uid('pp'), d = today();
  undoLabel = 'closing the pay period';
  var t = typeTotals(mm);
  upsert('Periods', { id: pid, startDate: setting('periodStart', '') || setting('syncStart', ''), endDate: d, income: r2(mm.top), cards: r2(mm.owed + mm.cardExtra),
                      spend: r2(mm.spent), bills: r2(mm.billsRows.length ? mm.billsDone : mm.reserve), saved: r2(mm.saved), byType: JSON.stringify(t) });
  mm.cur.forEach(function (r) { upsert('Checking', { id: r.id, period: pid }); });
  mm.cardLines.forEach(function (l) { if (!l.pending) upsert('Charges', { id: l.id, settled: pid }); });
  mm.alreadyCounted.forEach(function (id) { upsert('Charges', { id: id, settled: pid }); });
  // remember the pending ones counted here, so they aren't counted again once they post
  var keep = mm.closedPend.filter(function (p, i) { return mm.usedPend[i] !== 1 && p.on >= daysAgo(45); });
  mm.cardLines.forEach(function (l) { if (l.pending) { var c = find('Pending', l.id); keep.push({ cardId: c.cardId, amount: +c.amount, bankId: c.bankId || '', on: d }); } });
  if (!find('Settings', 'closedPending')) S.Settings.push({ id: 'closedPending', value: '' });
  upsert('Settings', { id: 'closedPending', value: JSON.stringify(keep) });
  if (!find('Settings', 'periodStart')) S.Settings.push({ id: 'periodStart', value: '' });
  upsert('Settings', { id: 'periodStart', value: d });
  render();
  toast('Pay period closed. Starting fresh. <button class="toast-btn" data-act="undo">Undo</button>', 8000);
}
