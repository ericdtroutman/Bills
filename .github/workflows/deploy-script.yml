# Sends server/ to Google Apps Script and updates the live web app (same link) on every push to main.
# Needs two repository secrets: CLASPRC_JSON (the sign-in from setup/connect-google.sh) and DEPLOYMENT_ID (the AKfy... id).
name: Deploy script

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-script.yml']
  workflow_dispatch:

concurrency:
  group: deploy-script
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        id: check
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$DEPLOYMENT_ID" ] || [ ! -f server/.clasp.json ]; then
            echo "::notice::Not connected to Apps Script yet (missing secrets or server/.clasp.json). Nothing deployed."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Make sure no passcode is written in the code
        if: steps.check.outputs.ready == 'yes'
        run: |
          if grep -nE "^\s*var\s+PASSCODE\s*=\s*['\"]" server/*.gs server/*.js 2>/dev/null; then
            echo "::error::A passcode is typed into the code. It belongs in Script Properties. Nothing deployed."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'yes'
        with:
          node-version: 20

      - name: Push and redeploy
        if: steps.check.outputs.ready == 'yes'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          npm install -g @google/clasp@3.4.1 --no-fund --no-audit --loglevel=error
          umask 077
          # Copying from a terminal can wrap long lines; JSON needs no line breaks, so drop them.
          printf '%s' "$CLASPRC_JSON" | tr -d '\r\n' > ~/.clasprc.json
          if ! node -e 'const j=JSON.parse(require("fs").readFileSync(process.env.HOME+"/.clasprc.json","utf8")); const t=(j.tokens||{}).default||j; if(!t.refresh_token) process.exit(2)'; then
            echo "::error::The CLASPRC_JSON secret isn't a complete sign-in. Paste it again from the setup script, from the first { to the last }."
            exit 1
          fi
          DEP="$(printf '%s' "$DEPLOYMENT_ID" | tr -d '[:space:]')"
          # The secret may hold the whole web app link (https://script.google.com/macros/s/AKfy.../exec).
          # clasp needs just the id in the middle, so take it out of the link.
          case "$DEP" in
            */s/*) DEP="$(printf '%s' "$DEP" | sed -E 's#^.*/s/([^/?]+).*$#\1#')" ;;
          esac
          cd server
          # Keep a copy of the code Google has right now, so a bad upload can be put back (Nov 12, 2026).
          PREV=/tmp/prev; HAVE_PREV=no
          mkdir -p "$PREV" && cp .clasp.json "$PREV"/
          if (cd "$PREV" && clasp pull > /tmp/pull.txt 2>&1) && ls "$PREV"/Code.* > /dev/null 2>&1 && [ -s "$PREV/appsscript.json" ]; then HAVE_PREV=yes; fi
          echo "Sending the code to Apps Script..."
          if ! clasp push --force; then
            echo "::error::Apps Script refused the upload. Check that the Apps Script API is on at script.google.com/home/usersettings."
            exit 1
          fi
          DESC="$(printf '%s' "${GITHUB_SHA::7} ${COMMIT_MSG:-manual deploy}" | head -n1 | cut -c1-90)"
          clasp list-deployments --json > /tmp/before.json 2>/dev/null || echo '[]' > /tmp/before.json
          # Before the web app moves to the new code: does the new code answer at all? A slip in the code, or a change that
          # needs a new Google permission, would stop the whole app until Eric fixed it by hand. So a short-lived test
          # deployment gets one empty ping (the same check as check-script.yml); any of the app's own refusals means it runs.
          # If it doesn't answer, the old code is put back and the web app is left alone. The version made for the test is
          # the one the web app then moves to, so this costs no extra version (Apps Script allows 200 per project).
          ANSWERS=unknown; VER=""; RESP=""
          TMP="$(clasp create-deployment --description "$DESC" --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log((j.deploymentId||"")+" "+(j.versionNumber||""))}catch(e){console.log("")}})')"
          TMP_ID="${TMP%% *}"; VER="${TMP#* }"; [ "$VER" = "$TMP" ] && VER=""
          if [ -n "$TMP_ID" ]; then
            echo "::add-mask::$TMP_ID"
            trap 'clasp delete-deployment "$TMP_ID" >/dev/null 2>&1 || true' EXIT
            for try in 1 2 3; do
              sleep 6
              RESP="$(curl -sSL --max-time 60 -H 'Content-Type: text/plain;charset=utf-8' --data '{"key":"","fn":"ping"}' "https://script.google.com/macros/s/$TMP_ID/exec" || true)"
              case "$RESP" in
                *'"PASSCODE:'*|*'"SETUP:'*|*'"LOCKED:'*) ANSWERS=yes; break ;;
                *) ANSWERS=no ;;
              esac
            done
            clasp delete-deployment "$TMP_ID" > /dev/null 2>&1 || echo "::warning::Couldn't remove the temporary deployment."
            trap - EXIT
          else
            echo "::warning::Couldn't make a test deployment, so the new code wasn't pinged before going live."
          fi
          if [ "$ANSWERS" = no ]; then
            # what Google said instead, with tags and anything id-like taken out (this repo is public)
            SAID="$(printf '%s' "$RESP" | tr '\n' ' ' | sed -E 's/<[^>]*>/ /g; s/[A-Za-z0-9_-]{20,}/…/g' | tr -s ' ' | cut -c1-160)"
            if [ "$HAVE_PREV" = yes ] && (cd "$PREV" && clasp push --force); then
              echo "::error title=The new code didn't answer::The old code was put back and the web app was not changed. Google answered: $SAID"
            else
              echo "::error title=The new code didn't answer::The web app was not changed, but the old code could NOT be put back, so the automatic sync is running the new code. Google answered: $SAID"
            fi
            exit 1
          fi
          [ "$ANSWERS" = yes ] && echo "::notice title=New code answers::Pinged before going live${VER:+ (version $VER)}."
          echo "Updating the web app..."
          if [ -z "$VER" ] || ! clasp redeploy "$DEP" -V "$VER" --description "$DESC"; then
            if ! clasp redeploy "$DEP" --description "$DESC"; then
              echo "::error::The code uploaded but the web app wasn't updated. Check that DEPLOYMENT_ID is the web app link or its AKfy... id (Deploy > Manage deployments)."
              exit 1
            fi
          fi
          # Google's deployment list can lag a few seconds behind the redeploy, so look again a few times
          # before deciding the version didn't move (on Oct 28 it reported "stayed on v21" while v22 was live).
          for try in 1 2 3 4 5 6; do
            clasp list-deployments --json > /tmp/after.json 2>/dev/null || echo '[]' > /tmp/after.json
            if DEP="$DEP" node -e '
              const fs = require("fs"), rd = f => { const d = JSON.parse(fs.readFileSync(f, "utf8")); return Array.isArray(d) ? d : (d.deployments || []); };
              const id = process.env.DEP, b = rd("/tmp/before.json").find(x => x.deploymentId === id), a = rd("/tmp/after.json").find(x => x.deploymentId === id);
              process.exit(a && (!b || a.versionNumber !== b.versionNumber) ? 0 : 1);
            '; then break; fi
            echo "Waiting for Google to show the new version ($try)..."
            sleep 10
          done
          # Prove the web app really moved to the new version; a quiet failure here once left it on old code.
          # Ids are shortened to their last 6 characters in anything printed: this repo is public.
          DEP="$DEP" node -e '
            const fs = require("fs"), rd = f => { const d = JSON.parse(fs.readFileSync(f, "utf8")); return Array.isArray(d) ? d : (d.deployments || []); };
            const before = rd("/tmp/before.json"), after = rd("/tmp/after.json"), id = process.env.DEP;
            const short = x => "…" + String(x).slice(-6);
            const b = before.find(x => x.deploymentId === id), a = after.find(x => x.deploymentId === id);
            console.log("::notice title=Web app deployments (" + after.length + ")::" + after.map(x => short(x.deploymentId) + " " +
              (x.versionNumber ? "v" + x.versionNumber : "HEAD") + (x.deploymentId === id ? " ← this deploy" : "")).join(" | "));
            if (!a) { console.log("::error::The deployment " + short(id) + " was not found. Check the DEPLOYMENT_ID secret."); process.exit(1); }
            if (b && a.versionNumber === b.versionNumber) { console.log("::error::The web app stayed on version " + a.versionNumber + ", so it is still running the old code."); process.exit(1); }
            console.log("Web app " + short(id) + " now on version " + a.versionNumber + (b ? " (was " + b.versionNumber + ")" : ""));
          '
          rm -f ~/.clasprc.json
          echo "Deployed."
